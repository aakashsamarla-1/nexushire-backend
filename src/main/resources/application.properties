# ===================================================================
# SPRING APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=enterprise-rag-assistant
server.port=${SERVER_PORT:8080}

# ===================================================================
# DATABASE - PostgreSQL
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# FILE UPLOADS
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# GROQ API CONFIGURATION
# ===================================================================
enterprise.gateway.groq.api-key=${GROQ_API_KEY}
enterprise.gateway.groq.base-url=https://api.groq.com
enterprise.gateway.groq.model-identifier=llama-3.3-70b-versatile
enterprise.gateway.groq.sampling-temperature=0.2
enterprise.gateway.groq.execution-token-limit=2000

# ===================================================================
# RESILIENCE4J CONFIGURATION
# ===================================================================
resilience4j.retry.instances.groqApi.max-attempts=3
resilience4j.retry.instances.groqApi.wait-duration=2s
resilience4j.circuitbreaker.instances.groqApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groqApi.wait-duration-in-open-state=30s

# ===================================================================
# LOGGING
# ===================================================================
logging.level.com.aakash.ragassistant=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# ACTUATOR
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always